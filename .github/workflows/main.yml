name: Build TACHYVEX
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publikuj aplikację (x64, self-contained)
        run: dotnet publish src/Tachyvex.App/Tachyvex.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zainstaluj Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Zbuduj instalator
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\tachyvex.iss'

      - name: Opublikuj instalator w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: TACHYVEX 2.0 (build ${{ github.run_number }})
          files: installer/output/TACHYVEX_Setup.exe
          body: Pobierz TACHYVEX_Setup.exe i uruchom. Instalator nie jest podpisany certyfikatem, więc SmartScreen może pokazać ostrzeżenie (Więcej informacji, Uruchom mimo to).

      - name: Testy (nie blokują instalatora)
        if: always()
        continue-on-error: true
        run: |
          dotnet test tests/Tachyvex.Tests -c Release
          dotnet test tests/Tachyvex.Tests.Windows -c Release
