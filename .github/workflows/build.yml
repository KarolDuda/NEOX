name: Build NEOX
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Znajdź projekt (działa też, gdy pliki leżą w podfolderze)
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path . -Recurse -Filter Tachyvex.App.csproj | Select-Object -First 1
          if (-not $csproj) {
            Write-Host "Nie znaleziono Tachyvex.App.csproj. Zawartość repozytorium:"
            Get-ChildItem -Recurse -Depth 3 | Select-Object -First 80 FullName
            throw "W repozytorium brakuje folderu src/Tachyvex.App. Wgraj wszystkie foldery projektu."
          }
          $root = $csproj.Directory.Parent.Parent.FullName
          Write-Host "Katalog główny projektu: $root"
          "PROJECT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path "$root\installer\tachyvex.iss")) { throw "Brakuje installer\tachyvex.iss" }

      - name: Publikuj aplikację (x64, self-contained)
        shell: pwsh
        run: dotnet publish "$env:PROJECT_ROOT\src\Tachyvex.App\Tachyvex.App.csproj" -c Release -r win-x64 --self-contained true -p:Version=2.0.${{ github.run_number }} -o "$env:PROJECT_ROOT\publish"

      - name: Diagnostyka kompilatora XAML (tylko przy błędzie)
        if: failure()
        shell: pwsh
        run: |
          $obj = Get-ChildItem -Path "$env:PROJECT_ROOT\src\Tachyvex.App\obj" -Recurse -Filter input.json | Select-Object -First 1
          Write-Host "input: $($obj.FullName)"
          $dir = $obj.DirectoryName
          $xc = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.winui" -Recurse -Filter XamlCompiler.exe | Select-Object -First 1
          Write-Host "compiler: $($xc.FullName)"
          $out = & $xc.FullName "$dir\input.json" "$dir\diag-output.json" 2>&1
          Write-Host "exit: $LASTEXITCODE"
          $out | ForEach-Object { Write-Host $_ }
          if (Test-Path "$dir\diag-output.json") { Get-Content "$dir\diag-output.json" -Raw }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host '== EVENT'; Write-Host $_.Message }
          Get-ChildItem $dir -Filter *.log -Recurse | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Raw }

      - name: Zainstaluj Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Zbuduj instalator
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=2.0.${{ github.run_number }} "$env:PROJECT_ROOT\installer\tachyvex.iss"'

      - name: Opublikuj instalator w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: NEOX 2.0 (build ${{ github.run_number }})
          files: |
            **/Neox_Setup.exe
          body: Pobierz Neox_Setup.exe i uruchom. Instalator nie jest podpisany certyfikatem, więc SmartScreen może pokazać ostrzeżenie (Więcej informacji, Uruchom mimo to).

      - name: Testy (nie blokują instalatora)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test "$env:PROJECT_ROOT\tests\Tachyvex.Tests" -c Release
          dotnet test "$env:PROJECT_ROOT\tests\Tachyvex.Tests.Windows" -c Release
